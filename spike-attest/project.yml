# Phase 5, spike B: App Attest from a customer-like app on a real iPhone (Sauce Labs).
# Generate the Xcode project with `xcodegen` in this folder (brew install xcodegen).
name: WolvyAttestSpike
options:
  bundleIdPrefix: net.wolvy.spike
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  WolvyAttestSpike:
    type: application
    platform: iOS
    sources: [WolvyAttestSpike]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.wolvy.spike.attest
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wolvy Attest
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
