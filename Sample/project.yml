# The Wolvy iOS SDK's sample app. Generate the Xcode project with `xcodegen` in this folder.
name: WolvySample
options:
  bundleIdPrefix: net.wolvy.player
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  WolvyPlayer:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  WolvySample:
    type: application
    platform: iOS
    sources: [WolvySample]
    dependencies:
      - package: WolvyPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.wolvy.player.sample
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wolvy Sample
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
