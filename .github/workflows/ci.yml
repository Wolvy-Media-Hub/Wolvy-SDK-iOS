name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests and the sample app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: A simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: xcodebuild -scheme WolvyPlayer -destination "id=${{ steps.sim.outputs.udid }}" test
      - name: Sample app (simulator and device)
        working-directory: Sample
        run: |
          xcodebuild -project WolvySample.xcodeproj -scheme WolvySample -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project WolvySample.xcodeproj -scheme WolvySample -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
